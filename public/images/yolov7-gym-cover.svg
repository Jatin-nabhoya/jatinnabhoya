<svg width="1456" height="816" viewBox="0 0 1456 816" xmlns="http://www.w3.org/2000/svg" font-family="'Consolas','SF Mono','Courier New',monospace">
  <defs>
    <radialGradient id="bg-glow" cx="0.6" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#0D2010"/>
      <stop offset="1" stop-color="#080E08"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1456" height="816" fill="url(#bg-glow)"/>

  <!-- subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.8" fill="#1A3520" opacity="0.6"/>
  </pattern>
  <rect width="1456" height="816" fill="url(#dots)"/>

  <!-- corner brackets -->
  <g stroke="#39FF14" stroke-width="2.5" fill="none" opacity="0.7">
    <!-- top-left -->
    <polyline points="32,60 32,32 60,32"/>
    <!-- top-right -->
    <polyline points="1396,32 1424,32 1424,60"/>
    <!-- bottom-left -->
    <polyline points="32,756 32,784 60,784"/>
    <!-- bottom-right -->
    <polyline points="1396,784 1424,784 1424,756"/>
  </g>

  <!-- top-left eyebrow -->
  <circle cx="62" cy="56" r="7" fill="#39FF14"/>
  <text x="82" y="62" font-size="18" fill="#39FF14" letter-spacing="4">COMPUTER VISION · OBJECT DETECTION</text>

  <!-- top-right model info -->
  <text x="1424" y="62" font-size="18" fill="#39FF14" letter-spacing="2" text-anchor="end">model: yolov7-custom · 5 classes</text>

  <!-- detection boxes - pull-up bar (top-left area) -->
  <g transform="translate(95,100)">
    <rect x="0" y="0" width="310" height="195" fill="none" stroke="#39FF14" stroke-width="2.5"/>
    <!-- label chip -->
    <rect x="0" y="-34" width="196" height="30" fill="#39FF14"/>
    <text x="10" y="-10" font-size="20" font-weight="700" fill="#0A1A0A">pull-up bar 0.88</text>
    <!-- pull-up bar icon -->
    <line x1="40" y1="97" x2="270" y2="97" stroke="#D0D0D0" stroke-width="14" stroke-linecap="round"/>
    <rect x="25" y="80" width="28" height="34" rx="4" fill="#B0B0B0"/>
    <rect x="257" y="80" width="28" height="34" rx="4" fill="#B0B0B0"/>
  </g>

  <!-- detection boxes - dumbbell (top-center) -->
  <g transform="translate(460,80)">
    <rect x="0" y="0" width="280" height="210" fill="none" stroke="#39FF14" stroke-width="2.5"/>
    <rect x="0" y="-34" width="188" height="30" fill="#39FF14"/>
    <text x="10" y="-10" font-size="20" font-weight="700" fill="#0A1A0A">dumbbell 0.96</text>
    <!-- dumbbell icon -->
    <line x1="60" y1="105" x2="220" y2="105" stroke="#B0B0B0" stroke-width="10" stroke-linecap="round"/>
    <rect x="30" y="80" width="42" height="50" rx="6" fill="#C8C8C8"/>
    <rect x="44" y="72" width="14" height="66" rx="4" fill="#A0A0A0"/>
    <rect x="208" y="80" width="42" height="50" rx="6" fill="#C8C8C8"/>
    <rect x="222" y="72" width="14" height="66" rx="4" fill="#A0A0A0"/>
  </g>

  <!-- detection boxes - kettlebell (top-right) -->
  <g transform="translate(1010,70)">
    <rect x="0" y="0" width="230" height="260" fill="none" stroke="#39FF14" stroke-width="2.5"/>
    <rect x="0" y="-34" width="196" height="30" fill="#39FF14"/>
    <text x="10" y="-10" font-size="20" font-weight="700" fill="#0A1A0A">kettlebell 0.93</text>
    <!-- kettlebell icon -->
    <ellipse cx="115" cy="180" rx="72" ry="68" fill="#C0C0C0"/>
    <ellipse cx="115" cy="180" rx="54" ry="50" fill="#A8A8A8"/>
    <path d="M 82 120 Q 82 72 115 68 Q 148 72 148 120" fill="none" stroke="#C0C0C0" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- detection boxes - barbell (middle-right, wide) -->
  <g transform="translate(790,320)">
    <rect x="0" y="0" width="560" height="185" fill="none" stroke="#39FF14" stroke-width="2.5"/>
    <rect x="0" y="-34" width="176" height="30" fill="#39FF14"/>
    <text x="10" y="-10" font-size="20" font-weight="700" fill="#0A1A0A">barbell 0.91</text>
    <!-- barbell icon -->
    <line x1="70" y1="92" x2="490" y2="92" stroke="#B8B8B8" stroke-width="8" stroke-linecap="round"/>
    <!-- left plates -->
    <rect x="50" y="54" width="22" height="76" rx="4" fill="#A0A0A0"/>
    <rect x="68" y="60" width="16" height="64" rx="3" fill="#C0C0C0"/>
    <!-- right plates -->
    <rect x="468" y="54" width="22" height="76" rx="4" fill="#A0A0A0"/>
    <rect x="480" y="60" width="16" height="64" rx="3" fill="#C0C0C0"/>
    <!-- center grip lines -->
    <line x1="220" y1="70" x2="220" y2="114" stroke="#888" stroke-width="3"/>
    <line x1="240" y1="70" x2="240" y2="114" stroke="#888" stroke-width="3"/>
    <line x1="260" y1="70" x2="260" y2="114" stroke="#888" stroke-width="3"/>
    <line x1="280" y1="70" x2="280" y2="114" stroke="#888" stroke-width="3"/>
    <line x1="300" y1="70" x2="300" y2="114" stroke="#888" stroke-width="3"/>
    <line x1="320" y1="70" x2="320" y2="114" stroke="#888" stroke-width="3"/>
  </g>

  <!-- detection boxes - resistance band (bottom-right) -->
  <g transform="translate(1020,530)">
    <rect x="0" y="0" width="230" height="220" fill="none" stroke="#39FF14" stroke-width="2.5"/>
    <rect x="0" y="-34" width="248" height="30" fill="#39FF14"/>
    <text x="10" y="-10" font-size="20" font-weight="700" fill="#0A1A0A">resistance band 0.85</text>
    <!-- resistance band icon - oval loop -->
    <ellipse cx="115" cy="110" rx="82" ry="50" fill="none" stroke="#D0D0D0" stroke-width="24"/>
    <ellipse cx="115" cy="110" rx="82" ry="50" fill="none" stroke="#A8A8A8" stroke-width="10"/>
  </g>

  <!-- bottom-left info card -->
  <rect x="52" y="500" width="660" height="278" rx="12" fill="#000000" fill-opacity="0.55"/>
  <rect x="52" y="500" width="660" height="278" rx="12" fill="none" stroke="#1A3520" stroke-width="1.5"/>

  <text x="86" y="554" font-size="60" font-weight="900" fill="#FFFFFF">Gym Equipment</text>
  <text x="86" y="622" font-size="60" font-weight="900" fill="#39FF14">Detection</text>
  <text x="86" y="664" font-size="22" fill="#8FA88F">Fine-tuned YOLOv7 on a custom 203-image dataset</text>

  <!-- mAP stat -->
  <text x="86" y="706" font-size="17" fill="#39FF14" letter-spacing="2">mAP@0.5 · BASELINE → FINE-TUNED</text>
  <text x="86" y="748" font-size="46" font-weight="700" fill="#5A7A5A" text-decoration="line-through">0.0005</text>
  <text x="220" y="748" font-size="36" fill="#39FF14"> → </text>
  <text x="272" y="748" font-size="46" font-weight="900" fill="#39FF14">~0.45</text>

  <!-- bottom-right meta -->
  <text x="1424" y="680" font-size="20" fill="#5A7A5A" text-anchor="end">Deep Learning · 2026</text>
  <text x="1424" y="712" font-size="20" fill="#5A7A5A" text-anchor="end">Jatin Nabhoya</text>
  <text x="1424" y="756" font-size="20" fill="#39FF14" text-anchor="end">PyTorch / YOLOv7 / Optuna / Transfer Learning</text>
</svg>
